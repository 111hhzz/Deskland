<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deskland · 沙滩（原型）</title>
<!--
  Deskland · 扁平插画风海边主题原型 v0.4（纯 WebGL2，2D，每帧直接计算）
  画风参考：扁平色块 + 喷绘颗粒（丝网印刷感）
  - 陆地场（CPU，图标变化时才算）：高斯融球 + 噪声扭曲 → 到海岸的距离 s；图标变化时岸线平滑过渡
  - 海：远处青蓝 → 近岸薄荷绿的颗粒渐变；水面上不规则的浅色斑驳光斑（越近岸越密，缓慢流动）
  - 浪：岸边一条细白线 + 海面一侧颗粒状水雾；稍远处一道向岸推进的淡浪线；海水周期性冲上沙滩
  - 沙滩：几层淡紫灰 / 灰粉的湿沙色带（之前海浪到过的位置），往内陆过渡到奶白干沙
  - 皮划艇：在深水里慢慢划，会绕开陆地；海鸟：在画面上空滑翔；椰子树：种在沙地上

  本文件只是引导壳：渲染逻辑在 scenes/FlatEngine.js，应用层（图标 / 面板 / 宿主消息）在 engine/DeskApp.js。
-->
<link rel="stylesheet" href="/themes/base.css">
<link rel="stylesheet" href="/themes/beach/theme.css">
<style>#panel, #panel.hidden { display: none; }</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="desktop"></div>

<div id="taskbar">
  <div class="apps">
    <div class="app"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="9.5" height="9.5" fill="#4cc2ff"/><rect x="12.5" y="2" width="9.5" height="9.5" fill="#4cc2ff"/><rect x="2" y="12.5" width="9.5" height="9.5" fill="#4cc2ff"/><rect x="12.5" y="12.5" width="9.5" height="9.5" fill="#4cc2ff"/></svg></div>
    <div class="app"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="#fff" stroke-width="2"/><path d="M15 15l5 5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></div>
    <div class="app"><svg viewBox="0 0 24 24"><path d="M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v1H2z" fill="#e09b1d"/><path d="M2 9h20v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" fill="#ffc83d"/></svg></div>
    <div class="app"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#1b8fd6"/><path d="M6 13c1-5 11-6 12 0-3-2-8-2-9 2 0 2 2 3 4 3-4 1-7-1-7-5z" fill="#6fe37a" opacity=".9"/></svg></div>
    <div class="app"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2.5" fill="#2b2b2b" stroke="#777"/><path d="M6 9l3 3-3 3M11 15h6" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></div>
  </div>
  <div id="clock"></div>
</div>

<aside id="panel" hidden>
  <header>
    <div><b>Deskland</b><span>沙滩 · 原型 v0.4</span></div>
    <div><button class="ibtn" id="collapse" title="折叠">–</button></div>
  </header>
  <div class="body">
    <div class="sec"><div class="t">桌面布局</div>
      <div class="seg">
        <button data-v="mine">仿你的桌面</button><button data-v="arranged">自动排列</button><button data-v="messy">杂乱</button><button data-v="minimal">极简</button>
      </div>
    </div>
    <div class="sec" id="sliders"></div>
    <div class="sec toggles">
      <label><input type="checkbox" data-key="debug">显示海岸线</label>
      <label><input type="checkbox" data-key="snap">对齐网格</label>
      <label><input type="checkbox" data-key="cap30">限帧 30fps</label>
    </div>
    <div class="sec btns">
      <button id="btnAdd">＋ 新建文件</button>
      <button id="btnSeed">换一种岸线</button>
    </div>
    <div id="stats"></div>
    <div class="hint">拖动图标，松手后海岸线会跟着移动<br>点击海面有涟漪 · Del 删除 · H 隐藏面板</div>
  </div>
</aside>
<div id="nogl">当前浏览器不支持 WebGL2，无法运行原型。</div>

<script type="module">
import { FlatEngine } from '../../scenes/FlatEngine.js';
import { DeskApp } from '../../engine/DeskApp.js';
import { installLegacyFor } from '../../engine/legacyInstall.js';

const QS = new URLSearchParams(location.search);
const engine = new FlatEngine(document.getElementById('art'), {
  wallpaper: QS.has('wallpaper'),   // 壁纸模式：桌面宿主加载，图标 / 暂停等消息来自宿主
  preview: QS.has('preview'),      // 预览模式：设置窗口里的缩略预览（iframe），消息来自父页面
});
const app = new DeskApp(engine);
installLegacyFor('beach', app, engine);   // 椰子树模块注入（必须在 init 之前）

// 调试 / 测试探针（字段与迁移前保持一致）
window.__dbg = {
  P: engine.params,
  SCENE: engine.scene,
  kayaks: engine.kayaks,
  birds: engine.birds,
  applyLayout: k => app.layoutIcons(k),
  settle: () => engine.settleAndRender(),   // 测试用：走完形态过渡并画一帧
  bench: () => engine.bench(),
};

engine.init().then(ok => {
  if (!ok) return;                 // 没有 WebGL2：BaseEngine 已经显示 #nogl
  app.start();
  engine.start();                  // 主循环由 BaseEngine 驱动（update + render）
  // 等主循环画出第一帧（云 / 场就绪）再报首帧，保证测试与视觉基线取到完整画面
  requestAnimationFrame(() => {
    window.__desklandReady = true;   // 测试同步信号：引擎已就绪（首帧）
    const host = window.chrome && window.chrome.webview;
    if (host) host.postMessage(JSON.stringify({ t: 'firstframe' }));
  });
});
</script>
<script src="/lib/ripple.js"></script>   <!-- 桌面点击涟漪（只读鼠标钩子） -->
</body>
</html>
